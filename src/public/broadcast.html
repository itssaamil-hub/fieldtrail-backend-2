<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Live report · Engage</title>
<style>
:root{font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f7f5;color:#183c3d;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-width:280px;background:#f3f7f5}
main{max-width:1220px;padding:24px 25px 56px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:28px 30px;border-radius:24px;background:linear-gradient(130deg,#103b41,#16676a 80%);color:#fff;position:relative;overflow:hidden;box-shadow:0 14px 32px rgba(13,65,65,.12)}
header:after{content:"";position:absolute;right:-110px;top:-195px;width:370px;height:370px;border-radius:100%;border:1px solid #ffffff30;box-shadow:0 0 0 60px #ffffff08,0 0 0 120px #ffffff04;pointer-events:none}
header>div{position:relative;z-index:1}header small:first-child{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.13em;font-weight:800;color:#d4f7e7}
header small:first-child:before{content:"e";width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:17px;font-weight:900;background:#efa957;color:#123b40}
header h1{font-size:clamp(25px,3vw,36px);line-height:1.18;letter-spacing:-.035em;margin:25px 0 9px;overflow-wrap:anywhere}
header small:last-child{font-size:12px;color:#c3e4dc}
header button{position:relative;z-index:1;white-space:nowrap;background:#ffffff20;border-color:#ffffff52;color:#fff;min-height:44px}
p{color:#647d76}
section{border:1px solid #e2ebe7;border-radius:20px;background:#fff;box-shadow:0 8px 26px #174d4208;padding:23px;margin:17px 0}
button,input,select{font:inherit;min-width:0;max-width:100%;border-radius:11px;padding:11px 14px;border:1px solid #d8e4de;color:#234c49;background:#fff}
button{font-size:13px;font-weight:700;cursor:pointer;touch-action:manipulation}button:disabled{cursor:default;opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f4b36a;outline-offset:2px}
.primary,.tabs button[aria-selected=true]{background:#17605f;color:#fff;border-color:#17605f}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#e7eeea;border-radius:17px;padding:6px;margin:18px 0 0}
.tabs button{min-height:49px;border:0;background:transparent;border-radius:12px;font-weight:800}
.tabs button[aria-selected=true]{background:#fff;color:#135c57;box-shadow:0 4px 14px #254b3c16}
#status{color:#a33c35;background:#fff0ed;border:1px solid #f3d6d0;padding:12px;border-radius:12px}#status:empty{display:none}
#unlock{max-width:510px;padding:26px}#unlock:before{content:"Private report";display:block;color:#a55c1a;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.09em;margin-bottom:12px}#unlock input{letter-spacing:.18em;font-size:18px}#unlock label{font-weight:700}
#report:before{content:"Live · Read-only";display:inline-flex;margin-bottom:6px;padding:5px 10px;border-radius:999px;background:#e7f5ec;color:#28725a;font-weight:750;font-size:11px}
#range{color:#627a72;font-size:12px;margin-bottom:5px}#updated{display:block;font-size:11px;color:#849b91}
.filters{display:grid;grid-template-columns:minmax(140px,1fr) minmax(190px,2fr) auto;align-items:end;gap:12px;padding:16px;background:#f5f9f6;border:1px solid #e8f0eb;border-radius:14px;margin:14px 0 17px}
.filters label{font-size:12px;color:#60776d;font-weight:700;display:flex;flex-direction:column;gap:7px;min-width:0}
.filters input,.filters select{width:100%;border-color:#d9e7df;background:#fff;min-height:45px}
.filters button{min-height:45px}
.table-wrap{max-width:100%;overflow:auto;margin-top:15px}
table{width:100%;border-collapse:collapse;text-align:left;min-width:480px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:#8a9b90;background:#f8faf8}
td,th{border-bottom:1px solid #eaf1ec;padding:14px;overflow-wrap:anywhere}td:first-child{font-weight:750;color:#234c47}
tr:nth-child(even) td{background:#fcfdfc}
.cards{display:none}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;justify-content:center}
.actions button{min-height:43px}
#empty{text-align:center;padding:26px;color:#6a8578}
[hidden]{display:none!important}
@media(max-width:680px){
 main{padding:0 0 max(24px,env(safe-area-inset-bottom))}
 header{border-radius:0 0 24px 24px;padding:calc(15px + env(safe-area-inset-top)) 18px 25px;box-shadow:none;gap:9px}
 header:after{width:230px;height:230px;right:-105px;top:-100px;box-shadow:0 0 0 45px #ffffff07}
 header h1{font-size:27px;line-height:1.18;margin:24px 0 9px}
 header small:first-child{letter-spacing:.08em;font-size:10px}
 header small:first-child:before{width:27px;height:27px}
 header button{padding:10px 11px;font-size:12px;min-height:42px}
 .tabs{margin:15px 12px 0;border-radius:14px}
 .tabs button{min-height:46px;font-size:13px}
 section{margin:12px 12px 0;border-radius:19px;padding:15px 13px}
 .filters{grid-template-columns:1fr 1fr;padding:12px;gap:9px}
 .filters label:nth-child(2){grid-column:1/-1;grid-row:1}
 .filters button{grid-column:1/-1}
 .filters input,.filters select{font-size:16px!important}
 .table-wrap{display:none}
 .cards{display:grid;gap:11px;margin-top:16px}
 .deal-card{padding:16px 14px;border:1px solid #e0eae3;border-radius:15px;background:#fff;box-shadow:0 4px 14px #1a51420a;min-width:0}
 .deal-card h3{font-size:16px;letter-spacing:-.02em;color:#1c4642;margin:0;padding-bottom:11px;border-bottom:1px solid #eef2ee;overflow-wrap:anywhere}
 .card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 10px;padding-top:12px}
 .card-grid div{font-size:13px;font-weight:700;color:#245b50;min-width:0;overflow-wrap:anywhere}
 .card-grid small{display:block;font-size:10px;color:#8b9f93;font-weight:750;margin-bottom:4px}
 .actions{justify-content:space-between}
 #unlock{margin:13px;padding:20px}
 #unlock input{font-size:18px}
}
@media(max-width:340px){
 header h1{font-size:23px}
 header{padding-left:12px;padding-right:12px}
 section{margin-left:8px;margin-right:8px}
 .tabs{margin-left:8px;margin-right:8px}
 .card-grid{gap:10px 7px}
}


/* Shared-report filters and financial overview; independent of CRM app layout. */
.quick-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 19px}
.quick-filter{background:#edf5f0;border:1px solid #d9e9e0;color:#2d665c;border-radius:100px;min-height:39px;padding:8px 14px;font-weight:750;font-size:12px;white-space:nowrap}
.quick-filter[aria-pressed=true]{color:white;background:#145d5b;border-color:#145d5b;box-shadow:0 4px 11px #154e431a}
.payment-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 18px}
.payment-stat{background:linear-gradient(160deg,#f4faf6,#edf5f0);border:1px solid #deebe2;border-radius:14px;padding:15px 13px;min-width:0;overflow-wrap:anywhere}
.payment-stat small{display:block;font-size:11px;color:#5c8172;font-weight:750;margin-bottom:7px}
.payment-stat strong{font-size:clamp(16px,1.7vw,22px);line-height:1.2;color:#134e49;letter-spacing:-.035em;font-weight:850}
@media(max-width:680px){
 .quick-filters{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:11px -13px 16px;padding:3px 13px 8px}
 .quick-filters::-webkit-scrollbar{display:none}
 .quick-filter{flex:0 0 auto;min-height:42px;font-size:12px}
 .payment-summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0 16px}
 .payment-stat{padding:13px 12px;border-radius:13px}
 .payment-stat strong{font-size:17px}
}

/* Deals-only additions: keep the existing Payments tab and layout untouched. */
.deal-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:14px 0 18px}
.deal-stat{background:linear-gradient(155deg,#f1faf5,#e9f4ee);border:1px solid #d9eade;border-radius:14px;padding:17px 15px;min-width:0;overflow-wrap:anywhere}
.deal-stat small{display:block;font-size:11px;color:#578070;font-weight:750;margin-bottom:6px}
.deal-stat strong{display:block;font-weight:850;color:#174c42;letter-spacing:-.035em;line-height:1.25;font-size:clamp(19px,2.1vw,26px);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.deal-value-cell{font-weight:850;color:#156550;font-variant-numeric:tabular-nums}
.deal-value-banner{display:none}
@media(max-width:680px){
 .deal-summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0 15px}
 .deal-stat{padding:13px 11px;border-radius:13px}
 .deal-stat small{font-size:10px}
 .deal-stat strong{font-size:clamp(15px,4.4vw,19px);overflow-wrap:anywhere}
 .deal-value-banner{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;
  background:#edf8f1;border:1px solid #d7ebe0;border-radius:12px;padding:12px 11px;margin-top:12px}
 .deal-value-banner small{font-size:11px;font-weight:800;color:#568373;white-space:nowrap}
 .deal-value-banner strong{font-size:clamp(14px,4.5vw,19px);font-weight:850;color:#155d4b;
  letter-spacing:-.02em;text-align:right;overflow-wrap:anywhere;min-width:0;font-variant-numeric:tabular-nums}
 .deal-card:has(> .deal-value-banner) .card-grid{padding-top:11px}
}
@media(max-width:340px){
 .deal-stat{padding:11px 8px}
 .deal-stat strong{font-size:14px}
 .deal-value-banner{align-items:flex-start;flex-direction:column;gap:3px}
 .deal-value-banner strong{text-align:left}
}
</style></head><body><main><header><div><small>ENGAGE · SHARED REPORT</small><h1 id="title">Live report</h1><small>Read-only · Refreshes every 60 seconds</small></div><button id="refresh" type="button">Refresh</button></header>
<p id="status" role="status" aria-live="polite">Loading…</p>
<section id="unlock" hidden><form id="pin-form"><label>Report PIN <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required></label> <button class="primary">Open report</button></form></section>
<div id="tabs" class="tabs" role="tablist" aria-label="Report sections" hidden><button type="button" data-tab="deals" role="tab" aria-selected="true">Deals</button><button type="button" data-tab="payments" role="tab" aria-selected="false">Payments</button></div>
<section id="report" hidden><form id="filters" class="filters" hidden><label>Status <select id="status-filter" aria-label="Filter status"></select></label><label>Search business or employee <input id="search" type="search" maxlength="100" placeholder="Search deals or payments"></label><button class="primary" type="submit">Apply filters</button></form>
<div class="quick-filters" id="quick-filters" role="group" aria-label="Filter report status" hidden></div>
<div class="payment-summary" id="payment-summary" aria-label="Payment totals" hidden></div>
<div class="deal-summary" id="deal-summary" aria-label="Deal totals for selected stage" hidden></div>
<p id="range"></p><small id="updated"></small>
<div class="table-wrap"><table><thead id="columns"></thead><tbody id="rows"></tbody></table></div>
<div class="cards" id="cards"></div><p id="empty" hidden>No matching records.</p>
<div class="actions"><button id="previous" type="button">Previous</button><span id="page"></span><button id="next" type="button">Next</button></div></section></main>
<script>
(function(){'use strict';
var combined=new URLSearchParams(location.search).get('mode')==='combined';
var token=location.hash.slice(1),pin='',offset=0,tab='deals',busy=false,loaded=false,search='';
var el=function(id){return document.getElementById(id);};
var choices={deals:[['all','All statuses'],['cold','Cold'],['conversation','Conversation'],['hot','Hot'],['demo','Demo'],['negotiation','Negotiation'],['won','Won'],['lost','Lost'],['nurture','Nurture']],payments:[['all','All accounts'],['pending','Pending'],['partial','Partially paid'],['overdue','Overdue'],['paid','Paid']]};
function statusOptions(){
 el('status-filter').replaceChildren();el('quick-filters').replaceChildren();
 choices[tab].forEach(function(pair){
  var o=document.createElement('option');o.value=pair[0];o.textContent=pair[1];el('status-filter').append(o);
  var button=document.createElement('button');button.type='button';button.className='quick-filter';button.textContent=pair[1];button.dataset.status=pair[0];
  button.onclick=function(){if(busy||el('status-filter').value===pair[0])return;el('status-filter').value=pair[0];syncFilters();load(0);};
  el('quick-filters').append(button);
 });
 syncFilters();
}
function syncFilters(){document.querySelectorAll('.quick-filter').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.status===el('status-filter').value));});}
function showSummary(r){
 var target=el('payment-summary');target.replaceChildren();
 var summary=r.summary;
 if(!combined||tab!=='payments'||!summary){target.hidden=true;return;}
 var specs=[['accounts','Accounts',false],['total','Total amount',true],['paid','Collected',true],['remaining','Remaining',true]];
 specs.forEach(function(spec){if(!Object.hasOwn(summary,spec[0]))return;
  var box=document.createElement('div');box.className='payment-stat';
  var caption=document.createElement('small');caption.textContent=spec[1];
  var value=document.createElement('strong');
  value.textContent=spec[2]?new Intl.NumberFormat('en-IN',{style:'currency',currency:r.currency}).format(Number(summary[spec[0]])):new Intl.NumberFormat('en-IN').format(Number(summary[spec[0]]));
  box.append(caption,value);target.append(box);
 });
 target.hidden=!target.children.length;
}
function showDealSummary(r){
 var target=el('deal-summary');target.replaceChildren();
 if(!combined||tab!=='deals'||!r.summary){target.hidden=true;return;}
 var specs=[['deals','Total deals',false],['value','Total deal value',true]];
 specs.forEach(function(spec){
  if(!Object.hasOwn(r.summary,spec[0]))return;
  var box=document.createElement('div');box.className='deal-stat';
  var label=document.createElement('small');label.textContent=spec[1];
  var value=document.createElement('strong');
  value.textContent=spec[2]?new Intl.NumberFormat('en-IN',{style:'currency',currency:r.currency}).format(Number(r.summary[spec[0]])):new Intl.NumberFormat('en-IN').format(Number(r.summary[spec[0]]));
  box.append(label,value);target.append(box);
 });
 target.hidden=!target.children.length;
}
function showValue(row,col,currency){var value=row[col.key];if(value===null||value===undefined)return '—';if(['total','paid','remaining','value'].includes(col.key))return new Intl.NumberFormat('en-IN',{style:'currency',currency:currency}).format(Number(value));return String(value);}
function display(r){
el('title').textContent=r.title;
showSummary(r);showDealSummary(r);
el('range').textContent=(r.from?r.from+' to '+r.to:'All time')+' · '+r.dateBasis+' · India time';
el('updated').textContent='Last updated '+new Date(r.updatedAt).toLocaleString();
el('columns').replaceChildren();el('rows').replaceChildren();el('cards').replaceChildren();
var head=document.createElement('tr');r.columns.forEach(function(c){var th=document.createElement('th');th.textContent=c.label;head.append(th);});el('columns').append(head);
r.rows.forEach(function(row){
 var tr=document.createElement('tr');
 r.columns.forEach(function(c){var td=document.createElement('td');td.textContent=showValue(row,c,r.currency);
  if(combined&&tab==='deals'&&c.key==='value')td.className='deal-value-cell';
  tr.append(td);});
 el('rows').append(tr);
 var card=document.createElement('article');card.className='deal-card';
 var heading=document.createElement('h3');heading.textContent=row.business||r.title;card.append(heading);
 var highlight=combined&&tab==='deals'&&r.columns.some(function(c){return c.key==='value';});
 if(highlight){
  var banner=document.createElement('div');banner.className='deal-value-banner';
  var amountLabel=document.createElement('small');amountLabel.textContent='Deal value';
  var amount=document.createElement('strong');amount.textContent=showValue(row,{key:'value'},r.currency);
  banner.append(amountLabel,amount);card.append(banner);
 }
 var grid=document.createElement('div');grid.className='card-grid';
 r.columns.forEach(function(c){if(c.key==='business'||(highlight&&c.key==='value'))return;
  var field=document.createElement('div'),lab=document.createElement('small');lab.textContent=c.label;
  field.append(lab,document.createTextNode(showValue(row,c,r.currency)));grid.append(field);});
 card.append(grid);el('cards').append(card);
});
el('empty').hidden=!!r.rows.length;el('page').textContent='Page '+(offset/50+1);
el('previous').disabled=offset===0;el('next').disabled=!r.hasMore;
}
async function load(nextOffset){
 if(busy)return;busy=true;el('refresh').disabled=true;el('previous').disabled=true;el('next').disabled=true;
 try{
  if(!token)throw Error('This report link is invalid.');
  var response=await fetch('/public/broadcast/read',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({token:token,pin:pin,offset:nextOffset,tab:combined?tab:undefined,status:combined?el('status-filter').value:undefined,search:combined?search:undefined})});
  var r=await response.json();
  if(!response.ok){if(response.status===401)el('unlock').hidden=false;throw Error(r.error||'Could not load report.');}
  if(combined!==(r.sharedType==='combined')){combined=r.sharedType==='combined';statusOptions();}
  offset=nextOffset;loaded=true;el('status').textContent='';el('unlock').hidden=true;el('report').hidden=false;
  el('tabs').hidden=!combined;el('filters').hidden=!combined;el('quick-filters').hidden=!combined;display(r);
 }catch(err){
  loaded=false;el('report').hidden=true;el('rows').replaceChildren();el('cards').replaceChildren();el('payment-summary').replaceChildren();el('deal-summary').replaceChildren();el('status').textContent=err.message;
 }finally{busy=false;el('refresh').disabled=false;}
}
el('pin-form').onsubmit=function(e){e.preventDefault();pin=el('pin').value;load(0);};
el('refresh').onclick=function(){load(offset);};el('previous').onclick=function(){load(Math.max(0,offset-50));};el('next').onclick=function(){load(offset+50);};
el('filters').onsubmit=function(e){e.preventDefault();search=el('search').value.trim();syncFilters();load(0);};
document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){if(busy||tab===b.dataset.tab)return;tab=b.dataset.tab;search='';el('search').value='';statusOptions();document.querySelectorAll('[data-tab]').forEach(function(x){x.setAttribute('aria-selected',String(x.dataset.tab===tab));});load(0);};});
statusOptions();
setInterval(function(){if(!document.hidden&&loaded)load(offset);},60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&loaded)load(offset);});
load(0);
})();
</script></body></html>
