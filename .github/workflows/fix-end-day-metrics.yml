name: Fix End Day metrics
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply End Day metrics fix
        run: node scripts/fix-end-day-metrics.js
      - name: Install
        run: npm ci
      - name: Critical dependency audit
        run: npm audit --omit=dev --audit-level=critical
      - name: Syntax check
        run: node --check src/utils/dayClosing.js
      - name: Test
        run: npm test
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/dayClosing.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix End Day won metrics query"
          git push
